<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Nosso app</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14101c" />
    <!-- iOS: sem estas duas, "Adicionar a Tela de Inicio" abre com a barra do Safari
         por cima e o push nao e liberado -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nosso app" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
    <!--
      Tem que vir ANTES do modulo do app. O Vite move o bundle final para o
      <head>; quando este detector ficava no fim do <body>, um 404 muito rapido
      podia acontecer antes de o listener existir. O aparelho ficava apenas com
      o fundo rosa, preso num index.html antigo que apontava para um bundle ja
      removido pelo deploy seguinte.
    -->
    <script data-casal-recovery>
      ;(function () {
        var CHAVE = 'casal.recuperando'

        function recuperar() {
          if (sessionStorage.getItem(CHAVE)) return
          sessionStorage.setItem(CHAVE, '1')
          var recarregar = function () { location.reload() }
          try {
            Promise.all([
              navigator.serviceWorker && navigator.serviceWorker.getRegistrations
                ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister() }))
                  })
                : Promise.resolve(),
              window.caches
                ? caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                  })
                : Promise.resolve(),
            ]).then(recarregar, recarregar)
          } catch (_) { recarregar() }
        }

        // Bundle ou CSS com hash antigo que ja nao existe no servidor.
        window.addEventListener('error', function (e) {
          var alvo = e && e.target
          if (!alvo || alvo === window) return
          var src = alvo.src || alvo.href || ''
          if (src.indexOf('/assets/') !== -1) recuperar()
        }, true)

        // O APP NAO MONTOU: a outra metade da rede, que faltava.
        //
        // O detector acima so ve arquivo que faltou (404 em /assets/). Mas o
        // app tambem pode nao montar com todos os arquivos presentes: um erro
        // durante a avaliacao do modulo mata o boot ANTES de qualquer React, e
        // o ErrorBoundary nem chega a existir pra pegar. O que se ve e o fundo
        // rosa do `body` com o `#root` vazio — foi exatamente o relato do dono.
        //
        // O teste de `#root` vazio ja existiu e foi removido por provocar
        // recarga falsa em aparelho lento. A diferenca agora e o PRAZO: 12
        // segundos depois do `load` (nao do inicio), que e muito mais do que
        // qualquer montagem legitima leva, mesmo em 3G ruim. E e uma vez por
        // sessao, pela mesma chave.
        //
        // Isto e recuperacao, nao conserto: se o app voltar a nao montar depois
        // de limpar tudo, o defeito e do codigo e tem que ser corrigido no
        // codigo. O que isto evita e o aparelho ficar preso pra sempre.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var raiz = document.getElementById('root')
            if (raiz && raiz.childElementCount === 0) {
              recuperar()
              return
            }
            sessionStorage.removeItem(CHAVE)
          }, 12000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Nosso app</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14101c" />
    <!-- iOS: sem estas duas, "Adicionar a Tela de Inicio" abre com a barra do Safari
         por cima e o push nao e liberado -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nosso app" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
    <!--
      Tem que vir ANTES do modulo do app. O Vite move o bundle final para o
      <head>; quando este detector ficava no fim do <body>, um 404 muito rapido
      podia acontecer antes de o listener existir. O aparelho ficava apenas com
      o fundo rosa, preso num index.html antigo que apontava para um bundle ja
      removido pelo deploy seguinte.
    -->
    <script data-casal-recovery>
      ;(function () {
        var CHAVE = 'casal.recuperando'

        function recuperar() {
          if (sessionStorage.getItem(CHAVE)) return
          sessionStorage.setItem(CHAVE, '1')
          // Recarregar FURANDO O CACHE HTTP.
          //
          // `location.reload()` nao basta, e foi por isso que a recuperacao nao
          // salvava ninguem: `caches.delete()` limpa a Cache API, mas o cache
          // HTTP do navegador continua guardando o 404 do bundle — e era ele que
          // prendia o aparelho no fundo rosa. Um endereco diferente e a unica
          // forma garantida de o navegador ir buscar de novo.
          var recarregar = function () {
            var u = location.pathname + '?recuperado=' + Date.now() + location.hash
            location.replace(u)
          }
          try {
            Promise.all([
              navigator.serviceWorker && navigator.serviceWorker.getRegistrations
                ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                    return Promise.all(rs.map(function (r) { return r.unregister() }))
                  })
                : Promise.resolve(),
              window.caches
                ? caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                  })
                : Promise.resolve(),
            ]).then(recarregar, recarregar)
          } catch (_) { recarregar() }
        }

        // Bundle ou CSS com hash antigo que ja nao existe no servidor.
        window.addEventListener('error', function (e) {
          var alvo = e && e.target
          if (!alvo || alvo === window) return
          var src = alvo.src || alvo.href || ''
          if (src.indexOf('/assets/') !== -1) recuperar()
        }, true)

        window.addEventListener('load', function () {
          // Segunda rede: o arquivo pode ate chegar, mas falhar antes de o
          // React montar. ErrorBoundary nao enxerga erro de import/modulo.
          //
          // O PRAZO E O QUE SEPARA ESTA REDE DA RECARGA FALSA. Um teste de
          // `#root` vazio ja existiu neste arquivo e foi REMOVIDO porque
          // disparava em aparelho lento e fazia o app baixar tudo duas vezes.
          // Com 2,5 s o risco volta: `load` diz que os arquivos chegaram, nao
          // que o React montou, e num celular fraco a primeira renderizacao
          // passa disso com facilidade.
          //
          // 8 s e folgado pra montagem legitima e ainda rapido pra quem esta
          // travado — quem esta preso no fundo rosa ia ficar preso pra sempre.
          setTimeout(function () {
            var raiz = document.getElementById('root')
            if (raiz && !raiz.firstElementChild) recuperar()
            else sessionStorage.removeItem(CHAVE)
          }, 8000)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

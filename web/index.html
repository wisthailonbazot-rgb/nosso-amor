<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Nosso app</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14101c" />
    <!-- iOS: sem estas duas, "Adicionar a Tela de Inicio" abre com a barra do Safari
         por cima e o push nao e liberado -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nosso app" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Rede de seguranca pro aparelho que ficou preso num index.html velho.
         Se o arquivo do app nao carregar (o nome dele muda a cada versao, e o
         deploy apaga os antigos), o aparelho apagaria a tela e ficaria em
         branco pra sempre — foi o que aconteceu no iPhone. Aqui a gente
         percebe a falha, joga fora o service worker e os caches, e recarrega
         UMA vez. A trava no sessionStorage e o que impede isso de virar um
         laco de recarregamento quando a falha for de internet, e nao de
         versao. -->
    <script>
      window.addEventListener('error', function (e) {
        var alvo = e && e.target
        if (!alvo || alvo === window) return
        var src = alvo.src || alvo.href || ''
        if (src.indexOf('/assets/') === -1) return
        if (sessionStorage.getItem('casal.recuperando')) return
        sessionStorage.setItem('casal.recuperando', '1')
        var pronto = function () { location.reload() }
        try {
          Promise.all([
            navigator.serviceWorker && navigator.serviceWorker.getRegistrations
              ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister() }))
                })
              : Promise.resolve(),
            window.caches
              ? caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k) }))
                })
              : Promise.resolve(),
          ]).then(pronto, pronto)
        } catch (_) { pronto() }
      }, true)
      // carregou direito: pode esquecer que houve recuperacao
      window.addEventListener('load', function () {
        setTimeout(function () { sessionStorage.removeItem('casal.recuperando') }, 4000)
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
